<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Перенаправление...</title>
  <script>
    // Перенаправление через 3 секунды
    setTimeout(function() {
      window.location.href = "https://example.com";
    }, 10);
  </script>
</head>
<body>
  <p>Вы будете перенаправлены через 3 секунды. 
     Если нет — <a href="https://example.com">нажмите сюда</a>.</p>
</body>
</html>
